name: Publish site

# Runs whenever anything is pushed or uploaded to main, including a new menu
# file in the menu/ folder. Only index.html and the newest menu file are
# published, so nothing else uploaded to the repo ever goes live.
#
# It also runs on a schedule to redraw menu/status.png (Open now / Closed),
# which the Involve U page shows, since that page can't run scripts.

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # GitHub cron is in UTC. Every 15 minutes from 9am to 2pm Chicago time on
    # weekdays (covers both daylight and standard time), plus just after
    # midnight so "Closed today" / "Opens at 11am today" switch over each day.
    - cron: "*/15 14-19 * * 1-5"
    - cron: "5 5,6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history, so we can tell which file was uploaded last

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: pip install pillow

      - name: Download the site fonts
        continue-on-error: true    # falls back to a plain font if this fails
        run: |
          mkdir -p fonts
          base=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -sfL -o "fonts/BigShouldersDisplay[wght].ttf" "$base/bigshouldersdisplay/BigShouldersDisplay%5Bwght%5D.ttf"
          curl -sfL -o "fonts/AtkinsonHyperlegible-Regular.ttf" "$base/atkinsonhyperlegible/AtkinsonHyperlegible-Regular.ttf"

      - name: Pick the newest menu file
        run: |
          python3 - <<'PY'
          import json, shutil, subprocess
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          IMAGES = {"png", "jpg", "jpeg", "webp", "gif"}
          TEXT = {"csv", "txt"}
          MAX_MB = 20

          site = Path("_site"); (site / "menu").mkdir(parents=True)
          shutil.copy("index.html", site / "index.html")

          newest, newest_time = None, 0
          newest_img, newest_img_time = None, 0
          menu_dir = Path("menu")
          for f in (menu_dir.iterdir() if menu_dir.is_dir() else []):
              ext = f.suffix.lower().lstrip(".")
              if not f.is_file() or ext not in IMAGES | TEXT:
                  continue
              if f.stat().st_size > MAX_MB * 1024 * 1024:
                  print(f"Skipping {f.name}: larger than {MAX_MB} MB")
                  continue
              out = subprocess.run(["git", "log", "-1", "--format=%ct", "--", str(f)],
                                   capture_output=True, text=True).stdout.strip()
              if out and int(out) > newest_time:
                  newest, newest_time = f, int(out)
              if out and ext in IMAGES and int(out) > newest_img_time:
                  newest_img, newest_img_time = f, int(out)

          if newest is None:
              print("No menu file found in menu/. The site will say no menu is posted.")
          else:
              ext = newest.suffix.lower().lstrip(".")
              shutil.copy(newest, site / "menu" / f"current.{ext}")
              posted = datetime.fromtimestamp(newest_time, ZoneInfo("America/Chicago"))
              info = {
                  "file": f"current.{ext}",
                  "type": "image" if ext in IMAGES else ext,
                  "posted_at": posted.isoformat(timespec="seconds"),
              }
              (site / "menu" / "info.json").write_text(json.dumps(info))
              print(f"Publishing {newest.name} (posted {info['posted_at']})")

          # menu/today.png: the newest screenshot, with the posting date stamped
          # across the top. The Involve U page shows this file, since that page
          # can't run scripts to read info.json.
          if newest_img is not None:
              from PIL import Image, ImageDraw, ImageFont
              when = datetime.fromtimestamp(newest_img_time, ZoneInfo("America/Chicago"))
              hour = when.strftime("%I").lstrip("0")
              label = f"Posted {when.strftime('%A, %B')} {when.day} at {hour}:{when.strftime('%M')}{when.strftime('%p').lower()}"
              img = Image.open(newest_img).convert("RGB")
              if img.width > 1600:
                  img = img.resize((1600, round(img.height * 1600 / img.width)))
              bar = max(44, img.width // 22)
              out_img = Image.new("RGB", (img.width, img.height + bar), (13, 59, 122))
              out_img.paste(img, (0, bar))
              size = int(bar * 0.5)
              try:
                  font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", size)
              except OSError:
                  font = ImageFont.load_default(size=size)
              draw = ImageDraw.Draw(out_img)
              top = (bar - (draw.textbbox((0, 0), label, font=font)[3])) // 2
              draw.text((int(bar * 0.4), top), label, fill=(246, 195, 36), font=font)
              out_img.save(site / "menu" / "today.png", optimize=True)
              print(f"Published menu/today.png from {newest_img.name} ({label})")

          # ---- Café open/closed status image (menu/status.png) ----
          from PIL import Image, ImageDraw, ImageFont
          CHI = ZoneInfo("America/Chicago")
          HOURS = {0: (11*60, 13*60), 1: (11*60, 13*60), 2: (11*60, 13*60), 3: (11*60, 13*60), 4: (11*60, 13*60)}  # Mon=0 .. Fri=4
          DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"]

          def clock(mins):
              h, m = divmod(mins, 60)
              ap = "am" if h < 12 else "pm"
              h = h % 12 or 12
              return f"{h}:{m:02d}{ap}" if m else f"{h}{ap}"

          def status_for(now):
              day, mins = now.weekday(), now.hour * 60 + now.minute
              today = HOURS.get(day)
              if today and today[0] <= mins < today[1]:
                  return "open", "Open now", f"Serving lunch until {clock(today[1])} on the 12th floor"
              if today and mins < today[0]:
                  return "soon", f"Opens at {clock(today[0])} today", f"Lunch {clock(today[0])}–{clock(today[1])} on the 12th floor"
              for i in range(1, 8):
                  d = (day + i) % 7
                  if d in HOURS:
                      o, c = HOURS[d]
                      when = "tomorrow" if i == 1 else DAYS[d]
                      head = "Closed for the day" if today else "Closed today"
                      return "closed", head, f"Next open {when}, {clock(o)}–{clock(c)}"
              return "closed", "Closed", "Check nl.edu/dining for the schedule"

          def font(path, size, variation=None):
              try:
                  f = ImageFont.truetype(path, size)
                  if variation:
                      f.set_variation_by_name(variation)
                  return f
              except Exception:
                  try:
                      return ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", size)
                  except OSError:
                      return ImageFont.load_default(size=size)

          def draw_status(now, out_path, fonts_dir="fonts"):
              state, head, sub = status_for(now)
              sub = f"{sub}  (as of {clock(now.hour*60+now.minute)} Chicago time)"
              S = 2                                         # draw at 2x for sharp text
              W, H = 760 * S, 104 * S
              img = Image.new("RGB", (W, H), (13, 59, 122))
              d = ImageDraw.Draw(img)
              big = font(f"{fonts_dir}/BigShouldersDisplay[wght].ttf", 50 * S, b"ExtraBold")
              small = font(f"{fonts_dir}/AtkinsonHyperlegible-Regular.ttf", 19 * S)
              lamp = {"open": (57, 217, 138), "soon": (246, 195, 36), "closed": (138, 151, 173)}[state]
              cy, r = 34 * S, 8 * S
              if state != "closed":                         # soft glow ring like the original
                  d.ellipse((6*S - 4*S, cy - r - 4*S, 6*S + 2*r + 4*S, cy + r + 4*S), fill=tuple(int(c*.35 + v*.65) for c, v in zip(lamp, (13, 59, 122))))
              d.ellipse((6*S, cy - r, 6*S + 2*r, cy + r), fill=lamp)
              d.text((34 * S, 4 * S), head, font=big, fill=(255, 255, 255))
              d.text((34 * S, 66 * S), sub, font=small, fill=(216, 230, 247))
              img.save(out_path, optimize=True)
              return state, head, sub

          state, head, sub = draw_status(datetime.now(CHI), site / "menu" / "status.png")
          print(f"Published menu/status.png: {head} / {sub}")
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
